name = "local-reader-server"
main = "src/cloudflare.ts"
compatibility_date = "2026-10-29"

[build]
cwd = ".."
command = "npm run cloudflare:build"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Defaults match the free/pro upload body limit.
# Override these values for a self-hosted or higher-tier deployment.
[vars]
MAX_UPLOAD_BYTES = "104857600"
MAX_DOWNLOAD_BYTES = "0"
TIMEOUT_MS = "120000"
MAX_REDIRECTS = "5"
ALLOW_PRIVATE_HOSTS = "false"
CORS_ORIGIN = "*"
