[package]
name = "reader-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["full", "shelf"]
full = [
    "layout",
    "font",
    "content",
    "pipeline",
    "search",
    "txt",
    "umd",
]
layout = ["font"]
font = ["dep:ttf-parser"]
content = ["dep:fancy-regex"]
pipeline = ["content", "layout"]
shelf = ["dep:pinyin"]
search = []
txt = ["dep:fancy-regex", "dep:chardetng", "dep:encoding_rs"]
umd = ["dep:flate2", "dep:base64"]
ebook = [
    "dep:ebook-rs",
    "dep:html-escape",
    "dep:imagesize",
    "dep:base64",
    "dep:fancy-regex",
]
epub = [
    "dep:rbook",
    "dep:html-escape",
    "dep:imagesize",
    "dep:base64",
    "dep:fancy-regex",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = { version = "0.14", optional = true }
pinyin = { version = "0.10", optional = true }
ttf-parser = { version = "0.25", optional = true }
flate2 = { version = "1.1", optional = true }
base64 = { version = "0.23", optional = true }
ebook-rs = { version = "0.18", default-features = false, features = ["wasm", "serde"], optional = true }
rbook = { version = "0.7", default-features = false, optional = true }
html-escape = { version = "0.2", optional = true }
imagesize = { version = "0.15", optional = true }
encoding_rs = { version = "0.8", optional = true }
chardetng = { version = "0.1", optional = true }
wasm-bindgen = "=0.2.100"
