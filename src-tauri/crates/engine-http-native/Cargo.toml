[package]
name = "engine-http-native"
version = "0.1.0"
edition = "2024"
description = "URL 模板 / HTTP / Cookie / 编码 / 限速"
license = "AGPL-3.0"
repository = "https://gitea.slcomplex.party/OpenToGithub/legado-rust-engine-code"
keywords = ["http-client", "url", "cookie", "encoding"]
categories = ["web-programming::http-client", "web-programming"]

[features]
default = ["native"]
native = ["dep:reqwest", "dep:tokio"]

[dependencies]
engine-model.workspace = true
bytes.workspace = true
chardetng.workspace = true
encoding_rs.workspace = true
http.workspace = true
psl.workspace = true
reqwest = { workspace = true, optional = true }
regex.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
url.workspace = true
