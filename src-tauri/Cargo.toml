[package]
name = "local-reader"
version = "0.1.0"
description = "legado local reader clone (Tauri 2.x)"
authors = ["local-reader"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "local_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
encoding_rs = "0.8"
fancy-regex = "0.14"
pinyin = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
aes = "0.8"
md-5 = "0.10"
rbook = { version = "0.7", default-features = false, features = ["threadsafe"] }
html-escape = "0.2"
imagesize = "0.15"
pdfium-render = { version = "0.9.4", default-features = false, features = ["image_025", "pdfium_latest", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
boa_engine = "0.22"
ebook-rs = { version = "0.18", default-features = false }
flate2 = "1.1.10"
base64 = "0.23"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
