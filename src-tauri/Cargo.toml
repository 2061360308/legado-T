[workspace]
resolver = "2"
members = [
    "crates/engine-model",
    "crates/engine-regex",
    "crates/engine-rule",
    "crates/engine-replace",
    "crates/engine-js",
    "crates/engine-js-wasm",
    "crates/engine-http-native",
    "crates/engine-flow",
    "crates/engine-rss",
    "crates/engine-native",
    "crates/reader-core",
    "crates/backup-core",
]
exclude = [
    "crates/ebook-wasm",
    "crates/rbook-wasm",
    "crates/backup-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["local-reader"]

[workspace.dependencies]
aes = "0.8"
bytes = "1"
cbc = "0.1"
chardetng = "0"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
des = "0.8"
ecb = "0.1"
encoding_rs = "0"
fancy-regex = "0.14"
flate2 = "1"
futures = "0.3"
html5ever = "0.40"
http = "1"
moka = { version = "0", features = ["sync"] }
psl = "2"
quick-xml = "0.38"
rand = "0.8"
redis = { version = "1", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
] }
regex = "1"
reqwest = { version = "0", default-features = false, features = [
    "rustls-tls",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "http2",
] }
scraper = { version = "0", features = ["deterministic"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_json_path = "0"
sxd-document = "0.3"
sxd-xpath = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1"
url = "2"
zhconv = "0.4"

engine-model = { path = "crates/engine-model" }
engine-regex = { path = "crates/engine-regex" }
engine-rule = { path = "crates/engine-rule" }
engine-replace = { path = "crates/engine-replace" }
engine-js = { path = "crates/engine-js" }
engine-http-native = { path = "crates/engine-http-native" }
engine-flow = { path = "crates/engine-flow" }
engine-rss = { path = "crates/engine-rss" }
engine-native = { path = "crates/engine-native" }

[package]
name = "local-reader"
version = "0.1.0"
description = "legado local reader clone (Tauri 2.x)"
authors = ["local-reader"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "local_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
encoding_rs = "0.8"
chardetng = "0.1"
fancy-regex = "0.14"
pinyin = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
aes = "0.8"
md-5 = "0.10"
pdfium-render = { version = "0.9.4", default-features = false, features = ["image_025", "pdfium_latest", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
futures = "0.3"
flate2 = "1.1.10"
base64 = "0.23"
tauri-plugin-reader-platform = { path = "plugins/reader-platform" }
reader-core = { path = "crates/reader-core", features = ["ebook", "epub"] }
backup-core = { path = "crates/backup-core" }
engine-model = { path = "crates/engine-model" }
engine-native = { path = "crates/engine-native" }
tokio = { version = "1", features = ["rt", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
